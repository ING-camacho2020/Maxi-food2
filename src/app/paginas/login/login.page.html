<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Maxi-Food</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" [fullscreen]="true">
  <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh;">
    <ion-card style="width: 100%; max-width: 420px; box-shadow: 0 4px 16px rgba(0,0,0,0.12);">
      <ion-card-header class="ion-text-center">
        <ion-card-title color="primary" style="font-weight: bold; font-size: 1.6rem;">Maxi-Food</ion-card-title>
        <ion-card-subtitle>Nutrición ideal para tu mascota</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <ion-item lines="full" class="ion-margin-bottom">
          <ion-icon name="mail-outline" slot="start" color="medium"></ion-icon>
          <ion-input label="Correo electrónico" labelPlacement="floating" type="email" [(ngModel)]="correo" placeholder="correo@ejemplo.com"></ion-input>
        </ion-item>

        <ion-item lines="full" class="ion-margin-bottom">
          <ion-icon name="lock-closed-outline" slot="start" color="medium"></ion-icon>
          <ion-input label="Contraseña" labelPlacement="floating" type="password" [(ngModel)]="password" placeholder="••••••••"></ion-input>
        </ion-item>

        <ion-button expand="block" shape="round" color="primary" class="ion-margin-top" (click)="iniciarSesion()">
          Ingresar
        </ion-button>

        <ion-button fill="clear" expand="block" size="small" class="ion-margin-top" color="medium">
          ¿No tienes cuenta? Regístrate
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
