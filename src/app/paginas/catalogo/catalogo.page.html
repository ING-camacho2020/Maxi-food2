<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Catálogo Maxi-Food</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" [fullscreen]="true">
  <ion-searchbar placeholder="Buscar alimento o marca..." (ionInput)="filtrar($event)"></ion-searchbar>

  <ion-segment value="todos" (ionChange)="cambiarCategoria($event)">
    <ion-segment-button value="todos">
      <ion-label>Todos</ion-label>
    </ion-segment-button>
    <ion-segment-button value="perro">
      <ion-label>Perros</ion-label>
    </ion-segment-button>
    <ion-segment-button value="gato">
      <ion-label>Gatos</ion-label>
    </ion-segment-button>
  </ion-segment>

  <ion-grid class="ion-margin-top">
    <ion-row>
      <ion-col size="12" size-md="6" *ngFor="let item of productosFiltrados">
        <ion-card>
          <ion-card-header>
            <ion-card-subtitle>{{ item.categoria | uppercase }} - {{ item.etapa }}</ion-card-subtitle>
            <ion-card-title>{{ item.nombre }}</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <p>{{ item.descripcion }}</p>
            <h3 style="color: var(--ion-color-primary); font-weight: bold; margin-top: 8px;">
              ${{ item.precio | number }} COP
            </h3>
            <ion-button expand="block" shape="round" color="success" class="ion-margin-top">
              <ion-icon name="cart-outline" slot="start"></ion-icon>
              Comprar
            </ion-button>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
